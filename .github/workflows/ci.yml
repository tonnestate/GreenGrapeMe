name: P0 sales intake tests
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e .
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate production SaaS browser JavaScript syntax
        run: node --check src/greengrapeme/web/saas.js
      - name: Exercise SaaS tenant isolation in JavaScript runtime
        run: node tests/saas_tenant_isolation.test.js
