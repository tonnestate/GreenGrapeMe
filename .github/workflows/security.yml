name: Mandatory Python security gates

# Do not treat passing scans as proof that a deployed service is secure.
# Re-evaluate known dependency vulnerabilities every night, not just on PRs.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependencies:
    name: Audit actual production dependency tree (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout with no persisted GitHub credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve exact runtime packages (including Gunicorn)
        run: |
          python -m venv "$RUNNER_TEMP/greengrapeme-production"
          "$RUNNER_TEMP/greengrapeme-production/bin/python" -m pip install --disable-pip-version-check -e '.[serve]'
          "$RUNNER_TEMP/greengrapeme-production/bin/python" -m pip check
          "$RUNNER_TEMP/greengrapeme-production/bin/python" -m pip freeze --local --exclude-editable > "$RUNNER_TEMP/runtime-requirements.txt"
          test -s "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Install independent vulnerability scanner
        run: python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
      - name: Fail on known vulnerabilities in pinned production packages
        run: |
          python -m pip_audit --no-deps --disable-pip --vulnerability-service osv \
            --requirement "$RUNNER_TEMP/runtime-requirements.txt" \
            --format json --output "$RUNNER_TEMP/runtime-audit.json"
      - name: Preserve audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-dependency-audit-${{ matrix.python-version }}
          path: ${{ runner.temp }}/runtime-audit.json
          if-no-files-found: warn
          retention-days: 30

  static-analysis:
    name: High-confidence Python SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with no persisted GitHub credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned Python static security scanner
        run: python -m pip install --disable-pip-version-check 'bandit==1.9.4'
      - name: Block HIGH-severity, HIGH-confidence security findings
        run: |
          bandit -r src/greengrapeme --severity-level high \
            --confidence-level high --format json \
            --output "$RUNNER_TEMP/python-sast.json"
      - name: Preserve SAST evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-security-analysis
          path: ${{ runner.temp }}/python-sast.json
          if-no-files-found: warn
          retention-days: 30
