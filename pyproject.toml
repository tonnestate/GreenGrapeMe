[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greengrapeme"
version = "0.1.0"
requires-python = ">=3.11"
description = "Evidence-first sales team execution contracts for FruitStack"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
greengrapeme = ["web/*.html", "web/*.js", "web/*.css"]
